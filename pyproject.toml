[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xrays-on-detector"
version = "0.1.0"
description = "Six-circle diffractometer simulation and a virtual instrument: from reciprocal space to the image on the detector"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Miloš Dubajić" }]
keywords = ["crystallography", "diffraction", "diffractometer", "reciprocal space", "synchrotron"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

# The simulation core needs only these two.
dependencies = [
    "numpy>=1.24",
    "diffcalc-core>=0.3",
]

[project.optional-dependencies]
# The PyQt6 virtual diffractometer (python -m xrays_on_detector.vdiff) and the
# single-crystal CIF viewer (python -m single_crystal). The viewer itself needs
# only numpy; these are what put it on screen.
# h5py is here as well as in `data` because the app's Load S(q) button reads an
# rspace3d reciprocal-space volume.
vdiff = ["PyQt6>=6.5", "matplotlib>=3.7", "scipy>=1.10", "h5py>=3.8"]
singlecrystal = ["PyQt6>=6.5", "matplotlib>=3.7"]
# Reading real frames and measured S(q) volumes.
data = ["fabio>=2023.1", "h5py>=3.8", "scipy>=1.10"]
# Structure factors from a CIF: ASE expands the symmetry to the full cell.
cif = ["ase>=3.22"]

[project.urls]
Homepage = "https://dubajicmilos.github.io/diffraction/"
Source = "https://github.com/dubajicmilos/xrays-on-detector"

[tool.setuptools.packages.find]
include = ["xrays_on_detector*", "single_crystal*"]

# The scattering tables are generated (tools/export_scattering.py) rather than
# written by hand, but the package cannot compute anything without them.
[tool.setuptools.package-data]
single_crystal = ["data/*.json"]
